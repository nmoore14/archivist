services:
  archivist:
    build: .
    ports:
      - "${ARCHIVIST_HOST_BIND:-127.0.0.1}:8080:8080"
    environment:
      ARCHIVIST_DB_PATH: /data/archivist.db
      ARCHIVIST_STORAGE_PATH: /data/storage
      ARCHIVIST_UPLOAD_PATH: /data/uploads
      # Override this to use any reachable Ollama server. For a host-machine
      # instance, use http://host.docker.internal:11434.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      ARCHIVIST_DEFAULT_MODEL: ${ARCHIVIST_DEFAULT_MODEL:-gemma3:1b}
      ARCHIVIST_EMBED_MODEL: ${ARCHIVIST_EMBED_MODEL:-nomic-embed-text}
      ARCHIVIST_HTTP_ADDR: ${ARCHIVIST_HTTP_ADDR:-:8080}
      ARCHIVIST_MODE: ${ARCHIVIST_MODE:-school}
    volumes:
      - archivist-data:/data
    depends_on:
      ollama:
        condition: service_started
    restart: unless-stopped

  ollama:
    build:
      context: .
      dockerfile: models/Dockerfile
    image: archivist-ollama-models:local
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

volumes:
  archivist-data:
  ollama-data:

networks:
  default:
    internal: true
